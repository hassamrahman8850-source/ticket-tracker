spring.application.name=ticket-tracker

# Database (matches docker-compose.yml one folder up)
spring.datasource.url=jdbc:postgresql://localhost:5433/tickets
spring.datasource.username=tickets
spring.datasource.password=tickets

# Day 1 only: let Hibernate create/update the table for us.
# We will replace this with real migrations (Flyway) later.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
